<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك - خدمات ديوان بلدية العربان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header class="site-header">
            <h1>دليلك - خدمات ديوان بلدية العربان</h1>
            <p>دليلك الشامل لمعرفة المستندات والرسوم الخاصة بالخدمات الحكومية</p>
        </header>

        <!-- مربع البحث -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن خدمة، مستند، أو محطة...">
        </div>

        <!-- حاوية الخدمات -->
        <div id="servicesContainer" class="services-grid">
            <!-- سيتم تعبئة الخدمات تلقائياً عبر JavaScript -->
        </div>

        <!-- تذييل الصفحة -->
        <footer class="site-footer">
            <p>جميع الحقوق محفوظة © ديوان بلدية العربان</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
