<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك - خدمات ديوان بلدية العربان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header class="site-header">
            <h1>دليلك - خدمات ديوان بلدية العربان</h1>
            <p>دليلك الشامل لمعرفة المستندات، الرسوم، وحالة توفر المحطات ومستودعات الغاز</p>
        </header>

        <!-- مربع البحث -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن خدمة، مستند، أو محطة...">
        </div>

        <!-- أزرار التصفية السريعة -->
        <div class="filter-buttons" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap;">
            <button class="filter-btn active" onclick="filterCategory('all', this)" style="padding: 8px 18px; border: none; background: #1e73e8; color: #fff; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;">جميع الخدمات</button>
            <button class="filter-btn" onclick="filterCategory('fuel-gas', this)" style="padding: 8px 18px; border: none; background: #e0e0e0; color: #333; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;">⛽ الوقود وغاز الطهي</button>
            <button class="filter-btn" onclick="filterCategory('official', this)" style="padding: 8px 18px; border: none; background: #e0e0e0; color: #333; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;">📄 الخدمات الإدارية والمصرفية</button>
        </div>

        <!-- حاوية الخدمات -->
        <div id="servicesContainer" class="services-grid">
            <!-- سيتم تعبئة الخدمات تلقائياً عبر JavaScript -->
        </div>

        <!-- تذييل الصفحة -->
        <footer class="site-footer">
            <p>جميع الحقوق محفوظة © ديوان بلدية العربان</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
