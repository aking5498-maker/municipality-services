<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل خدمات بلدية العربان </title>
    <!-- استدعاء خط عربي وتصميم الأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر أو الترويسة -->
    <header>
        <div class="container header-content">
          <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
    <img src="https://github.com/aking5498-maker/municipality-services/blob/main/logo.png?raw=true" alt="شعار البلدية" style="height: 55px; width: auto;">
    <span style="font-weight: bold; font-size: 18px; color: #333;">بلدية العربان</span>
</div>
            <nav>
                <a href="#" class="active">الرئيسية</a>
                <a href="#services">الخدمات</a>
                <a href="#about"> عن البلدية</a>
            </nav>
        </div>
    </header>

    <!-- قسم البحث الرئيسي -->
    <section class="hero">
        <div class="container">
            <h2>دليل خدمات بلدية العربان </h2>
            <p>مرحباً بك، كيف يمكننا خدمتك اليوم؟ ابحث عن أي خدمة...</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن الخدمة (مثلاً: إصدار رخصة، إصدار جواز...)">
            </div>
        </div>
    </section>

    <!-- قسم عرض الخدمات -->
    <section id="services" class="container services-section">
        <h3>الخدمات الأكثر طلباً</h3>
        <div class="services-grid" id="servicesContainer">
            <!-- سيتم تعبئة الخدمات تلقائياً عبر ملف الجافاسكريبت -->
        </div>
    </section>

    <!-- تذييل الصفحة -->
    <footer>
        <p>&copy; 2026 بلدية العربان - جميع الحقوق محفوظة</p>
        <p style="margin-top: 5px; font-size: 12px; color: #555555;">
            تصميم وتطوير: <span style="color: #0066cc; font-weight: 600;">م. عبدالباري فرحات</span>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
